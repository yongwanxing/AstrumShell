<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="{{ theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ pageTitle }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.1.0/remixicon.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <script>
        // 首屏前应用本地缓存的主题，避免与 localStorage 不一致时闪烁
        (function () {
            try {
                var cached = localStorage.getItem('webui.theme');
                if (cached) document.documentElement.setAttribute('data-theme', cached);
            } catch (e) { /* 忽略 */ }
        })();
    </script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                {{ navItems }}
            </nav>
            <div class="sidebar-footer">
                <a href="/settings" class="settings-btn{{ settingsActive }}" title="{{ settingsTitle }}">
                    <i class="ri-settings-3-line"></i>
                </a>
            </div>
        </aside>

        <main class="content">
            <div class="content-body">
                {{ content }}
            </div>
        </main>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
