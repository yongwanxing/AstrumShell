name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # nodejs-adapter 插件的测试依赖 node/npm，缺失时会自动 skip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖（可编辑安装）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: 语法与编码检查（compileall）
        run: python -m compileall -q oss store tools scripts main.py

      - name: 单元测试
        run: python -m pytest -q oss/tests

      - name: 端到端冒烟（起服务并探活 /api/status）
        run: python scripts/smoke_serve.py --port 8099 --timeout 120
