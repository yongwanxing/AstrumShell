services:
  astrumshell:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrumshell
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP API + 网站
      - "8081:8081"   # WebSocket
      - "8082:8082"   # HTTP TCP
    volumes:
      # 插件热更新（无需重建镜像）
      - ./store/@{AstrumShell}:/app/store/@{AstrumShell}:ro
      - ./store/@{Upstream}:/app/store/@{Upstream}:ro
      # 数据持久化
      - astrumshell-data:/app/data
      # 配置可覆盖（实际配置文件是 oss.config.json）
      - ./oss.config.json:/app/oss.config.json:ro
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M

volumes:
  astrumshell-data:
    driver: local
